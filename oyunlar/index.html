  <body data-page="games">
    <a class="skip-link" href="#main-content">Ana içeriğe geç</a>
    <div id="root"></div>
    <script>
      // Send first-time visitors to their own language. The page still SERVES
      // Turkish to everyone (crawlers included), so the Turkish URLs keep their
      // own indexing; only real browsers are forwarded, and only once.
      (function () {
        try {
          var SUPPORTED = ['tr', 'en', 'es', 'ar', 'ru', 'zh'];
          var ROUTES = {
            en: { services: 'services',  games: 'games',   about: 'about',      contact: 'contact' },
            es: { services: 'servicios', games: 'juegos',  about: 'nosotros',   contact: 'contacto' },
            ar: { services: 'khadamat',  games: 'alaab',   about: 'man-nahnu',  contact: 'ittasil-bina' },
            ru: { services: 'uslugi',    games: 'igry',    about: 'o-nas',      contact: 'kontakty' },
            zh: { services: 'fuwu',      games: 'youxi',   about: 'guanyu',     contact: 'lianxi' }
          };
          if (/bot|crawl|spider|slurp|bingpreview|facebookexternalhit|embedly|quora|pinterest|vkshare|whatsapp|telegram|lighthouse|headless/i.test(navigator.userAgent)) return;
          if (sessionStorage.getItem('tion-redirected')) return;

          var stored = null;
          try { stored = localStorage.getItem('tion-locale'); } catch (e) {}

          var target = null;
          if (stored && SUPPORTED.indexOf(stored) !== -1) {
            target = stored;
          } else {
            var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
            for (var i = 0; i < langs.length; i++) {
              if (!langs[i]) continue;
              var base = String(langs[i]).toLowerCase().split('-')[0];
              if (SUPPORTED.indexOf(base) !== -1) { target = base; break; }
            }
          }

          if (!target || target === 'tr') return;

          var page = document.documentElement.getAttribute('data-page') ||
                     (document.body && document.body.getAttribute('data-page')) || 'home';
          var segment = page === 'home' ? '' : ((ROUTES[target] && ROUTES[target][page]) || '');
          var dest = '/' + target + (segment ? '/' + segment + '/' : '/');

          if (dest === location.pathname) return;
          sessionStorage.setItem('tion-redirected', '1');
          location.replace(dest + location.hash);
        } catch (e) {
          // Never let a redirect failure block the page.
        }
      })();
    </script>
